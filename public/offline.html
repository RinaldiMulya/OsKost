<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Koneksi Terputus | OsKost</title>
  <style>
    body {
      background-color: #0a0a0a;
      color: #e5e5e5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
      text-align: center;
    }
    .container {
      max-width: 400px;
      padding: 30px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      backdrop-filter: blur(10px);
    }
    .icon {
      font-size: 48px;
      margin-bottom: 20px;
      color: #00cc40;
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      margin: 0 0 10px 0;
      color: #ffffff;
    }
    p {
      font-size: 15px;
      line-height: 1.5;
      margin: 0 0 24px 0;
      color: #a3a3a3;
    }
    .btn {
      display: inline-block;
      background-color: #00cc40;
      color: #000000;
      font-weight: 700;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 12px;
      transition: background-color 0.2s;
    }
    .btn:hover {
      background-color: #00b338;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📡</div>
    <h1>Koneksi Terputus</h1>
    <p>Aplikasi OsKost tidak dapat terhubung ke internet saat ini. Periksa koneksi data atau Wi-Fi Anda, lalu coba lagi.</p>
    <a href="javascript:window.location.reload();" class="btn">Coba Lagi</a>
  </div>
</body>
</html>
